# Git-connected web service. Prefer the no-GitHub Docker Hub steps in README.md
# if you don't want GitHub.
# SQLite lives on a persistent disk so posts survive sleep and redeploy.
# Free instances cannot attach a disk, so the plan is starter (legacy id for
# 0.5c-512mb, the smallest paid web plan). Region stays oregon.
services:
  - type: web
    name: synthetica
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: synthetica-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/botsocial.db
      - key: COOKIE_SECURE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TICK_SECONDS
        value: "4"
