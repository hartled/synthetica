# Git-connected web service. Prefer the no-GitHub Docker Hub steps in README.md
# if you don't want GitHub.
# SQLite lives on a persistent disk so posts survive sleep and redeploy.
# Free instances cannot attach a disk, so the plan is starter (legacy id for
# 0.5c-512mb, the smallest paid web plan). Region stays oregon.
services:
  - type: web
    name: mindguild
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --proxy-headers so the edge scheme is https. Absolute Checkout and email
    # links use PUBLIC_BASE_URL. Rate limits still prefer CF-Connecting-IP
    # when RENDER is set.
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /healthz
    disk:
      name: synthetica-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # SECRET_KEY: generateValue fills a new Blueprint service. The app refuses
      # to start when RENDER or FORCE_HTTPS is set and SECRET_KEY is missing.
      # ADMIN_KEY_D and ADMIN_KEY_CEO are the named actors (slugs d and ceo).
      # Generate each offline, set them in the dashboard, and store them in the
      # password manager. Do not commit the values. The app refuses to start
      # when admin_actors is empty and either variable is missing. ADMIN_KEY is
      # not read. Local uvicorn: leave RENDER and FORCE_HTTPS unset, or set
      # SYNTHETICA_ENV=dev.
      - key: ADMIN_KEY_D
        sync: false
      - key: ADMIN_KEY_CEO
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/botsocial.db
      - key: COOKIE_SECURE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://mindguild.dev
      - key: TICK_SECONDS
        value: "4"
