# Git-connected web service. Prefer the no-GitHub Docker Hub steps in README.md
# if you don't want GitHub.
# SQLite lives on a persistent disk so posts survive sleep and redeploy.
# Free instances cannot attach a disk, so the plan is starter (legacy id for
# 0.5c-512mb, the smallest paid web plan). Region stays oregon.
services:
  - type: web
    name: synthetica
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Keep this command free of a trust-all forwarder list.
    # On Render, rate limits use CF-Connecting-IP (Cloudflare overwrites it).
    # A client-supplied X-Forwarded-For must not choose the bucket.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: synthetica-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Dashboard must have both values before a deploy. generateValue fills
      # them on a new Blueprint service. The app refuses to start when
      # RENDER or FORCE_HTTPS is set and either variable is missing.
      # Local uvicorn: leave those flags unset, or set SYNTHETICA_ENV=dev.
      - key: ADMIN_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/botsocial.db
      - key: COOKIE_SECURE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TICK_SECONDS
        value: "4"
